- name: catalogo
  label: Catálogo de produtos
  label_singular: catálogo
  description: Fotos, cores, material e técnica das peças do /catalogo/ e dos destaques. Cada alteração passa pelo fluxo de revisão e vai ao ar depois do build.
  editor:
    preview: false
  delete: false
  files:
  - name: produtos
    label: 'Catálogo: fotos, cores, material e técnica'
    file: src/data/produtos.json
    fields:
    - label: Observação
      name: observacao
      widget: hidden
      required: false
    - label: Fotos do catálogo
      name: imagens
      label_singular: foto
      widget: list
      collapsed: true
      add_to_top: true
      summary: '{{fields.produto}} · {{fields.cor.nome}} · {{fields.aprovacao}}'
      fields:
      - label: Foto
        name: arquivo
        widget: image
        choose_url: false
        media_folder: /img/produtos
        public_folder: /img/produtos
        hint: Fundo claro, peça centralizada, quadrada, de preferência 1254 × 1254 px (mínimo 1000 px). Só fotos próprias ou com licença.
      - label: Produto
        name: produto
        widget: string
        hint: 'Nome no site. Fotos com o mesmo nome formam um único card, com uma bolinha por cor. Ex.: Caneca'
      - label: Categoria
        name: categoria
        widget: select
        options:
        - label: Vestuário
          value: vestuario
        - label: Canetas e escritório
          value: canetas-escritorio
        - label: Tecnologia
          value: tecnologia
        - label: Bolsas e embalagens
          value: bolsas-embalagens
        - label: Garrafas e copos
          value: garrafas-copos
        - label: Cozinha e bar
          value: cozinha-bar
        - label: Acessórios
          value: acessorios
        - label: Casa e bem-estar
          value: casa-bem-estar
        - label: Hotelaria e gastronomia
          value: hotelaria-gastronomia
      - label: Descrição do modelo
        name: modelo
        widget: string
        required: false
        hint: Uma linha abaixo do nome. Não afirme material ou técnica que ainda não foram confirmados.
      - label: Cor
        name: cor
        widget: object
        collapsed: false
        fields:
        - label: Nome da cor
          name: nome
          widget: string
          hint: 'Ex.: Azul-marinho'
        - label: Cor (bolinha no site)
          name: hex
          widget: color
          allowInput: true
          pattern:
          - ^#[0-9A-Fa-f]{6}$
          - 'Use o formato #RRGGBB'
      - label: Material
        name: material
        widget: object
        collapsed: false
        fields:
        - label: Valor
          name: valor
          widget: string
          required: false
          hint: 'Ex.: Cerâmica, aço inox, algodão. Só aparece no site quando marcado como confirmado.'
        - label: Situação
          name: status
          widget: select
          options: &id001
          - label: A confirmar (o site mostra "sob consulta")
            value: a_confirmar
          - label: Confirmado (aparece no site)
            value: confirmado
          default: a_confirmar
      - label: Técnica de personalização
        name: tecnica
        widget: object
        collapsed: false
        fields:
        - label: Valor
          name: valor
          widget: string
          required: false
          hint: 'Ex.: Bordado, silk, gravação a laser. Só aparece no site quando marcada como confirmada.'
        - label: Situação
          name: status
          widget: select
          options: *id001
          default: a_confirmar
      - label: Texto alternativo da foto
        name: alt
        widget: string
        hint: 'O que aparece na foto, para leitores de tela e para o Google. Ex.: Caneca branca de cerâmica com a marca TaMa.'
      - label: Foto ilustrativa (gerada ou mockup)
        name: ilustrativa
        widget: boolean
        default: true
        required: false
        hint: Desmarque só para fotografias reais do produto.
      - label: Situação da foto
        name: aprovacao
        widget: select
        default: revisao
        options:
        - label: Em revisão (aparece no site)
          value: revisao
        - label: Aprovada
          value: aprovada
        - label: Substituir (sai do site)
          value: substituir
        - label: Retirada (sai do site)
          value: retirada
      - label: Onde é usada
        name: uso
        widget: select
        multiple: true
        required: false
        default:
        - catalogo
        options:
        - label: Catálogo
          value: catalogo
        - label: Home
          value: home
        - label: Brindes
          value: brindes
        - label: Kits
          value: kits
        - label: Confecções
          value: confeccoes
      - label: Vista
        name: vista
        widget: select
        default: frente
        required: false
        options:
        - label: Frente, numa cor (bolinha de cor no site)
          value: frente
        - label: 'Grupo: todas as cores juntas (abre o card)'
          value: grupo
        - label: Verso (aparece ao passar o mouse e na galeria)
          value: verso
        - label: Detalhe (só na galeria)
          value: detalhe
        hint: 'Grupo: use "Todas as cores" como nome da cor. Verso: use o nome da cor da frente correspondente.'
      - label: Identificador
        name: id
        widget: string
        required: false
        hint: 'Deixe vazio em itens novos: o site gera (produto~cor). Não mude o de itens existentes: a home e as seleções usam esse nome.'
      - label: Origem da foto
        name: origem
        widget: string
        required: false
        hint: 'Ex.: Fotografia própria em 20/10/2026.'
      - label: Observação interna
        name: observacao
        widget: text
        required: false
      - label: fornecedor
        name: fornecedor
        widget: hidden
        required: false
      - label: sku
        name: sku
        widget: hidden
        required: false
      - label: estoque
        name: estoque
        widget: hidden
        required: false
      - label: substitui
        name: substitui
        widget: hidden
        required: false
      - label: mestre
        name: mestre
        widget: hidden
        required: false
      - label: largura
        name: largura
        widget: hidden
        required: false
      - label: altura
        name: altura
        widget: hidden
        required: false
      - label: sha256
        name: sha256
        widget: hidden
        required: false
      - label: bytes
        name: bytes
        widget: hidden
        required: false
      - label: atualizado_em
        name: atualizado_em
        widget: hidden
        required: false
