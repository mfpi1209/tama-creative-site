  - label: Outros guias (relacionados)
    name: relacionados
    widget: relation
    collection: blog
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    multiple: true
    required: false
    max: 2
    hint: Até 2. Sem escolha, o site mostra os da mesma categoria e os mais recentes.
  - label: Rascunho (não publicar)
    name: draft
    widget: boolean
    default: false
    required: false
