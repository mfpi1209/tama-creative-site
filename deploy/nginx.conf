# Site estático TaMa Creative (substitui _headers e _redirects do Netlify).
# HTTPS e domínio ficam no Traefik do Easypanel; aqui é só HTTP interno.
# limite de envios do formulário por IP (protege o webhook do n8n)
limit_req_zone $binary_remote_addr zone=forms:1m rate=6r/m;
# simulador "Veja sua marca": envios com arquivo (logo + mockup), limite próprio e mais baixo
limit_req_zone $binary_remote_addr zone=simulador:1m rate=4r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # URLs antigas (301)
    location = /brindes    { return 301 /brindes-corporativos/; }
    location = /kits       { return 301 /kits-corporativos/; }
    location = /curadoria  { return 301 /brindes-corporativos-premium/; }
    location = /confeccoes { return 301 /confeccoes-personalizadas/; }
    location = /uniformes  { return 301 /confeccoes-personalizadas/; }
    location = /marcas     { return 301 /branding-identidade-visual/; }
    location = /branding   { return 301 /branding-identidade-visual/; }
    location = /contato    { return 301 /solicitar-proposta/; }
    location = /proposta   { return 301 /solicitar-proposta/; }

    # formulário de proposta -> webhook do n8n (rede interna do Easypanel; resolvido em tempo de execução)
    resolver 127.0.0.11 valid=30s ipv6=off;
    # simulador "Veja sua marca" -> webhook do n8n (logo até 5 MB + mockup ~1 MB em multipart)
    location = /api/simulador {
        limit_except POST { deny all; }
        limit_req zone=simulador burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 8m;
        client_body_timeout 30s;
        set $n8n_upstream http://tama_n8n:5678;
        proxy_pass $n8n_upstream/webhook/simulador;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
    }

    location = /api/proposta {
        limit_except POST { deny all; }
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        set $n8n_upstream http://tama_n8n:5678;
        proxy_pass $n8n_upstream/webhook/proposta;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # arquivos com hash no nome: cache de 1 ano
    location ~ ^/(img|fonts|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
