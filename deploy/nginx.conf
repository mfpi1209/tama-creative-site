# Site estático TaMa Creative (substitui _headers e _redirects do Netlify).
# HTTPS e domínio ficam no Traefik do Easypanel; aqui é só HTTP interno.
# limite de envios do formulário por IP (protege o webhook do n8n)
limit_req_zone $binary_remote_addr zone=forms:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # IP real do visitante (o Traefik do Easypanel fica na frente): sem isto, o limite de envios do formulário
    # valeria para todos os visitantes juntos, porque todos chegariam com o IP do Traefik.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # arquivos de configuração do Netlify gerados pelo build: não servir
    location ~ ^/_(redirects|headers)$ { return 404; }

    # URLs antigas (301)
    location = /brindes    { return 301 /catalogo/; }
    location ^~ /brindes/  { return 301 /catalogo/; }
    location = /adm        { return 301 /admin/; }
    location = /kits       { return 301 /kits-corporativos/; }
    location = /curadoria  { return 301 /brindes-corporativos-premium/; }
    location = /confeccoes { return 301 /confeccoes-personalizadas/; }
    location = /uniformes  { return 301 /confeccoes-personalizadas/; }
    location = /marcas     { return 301 /; }
    location = /branding   { return 301 /; }
    location ^~ /branding-identidade-visual { return 301 /; }   # a TaMa não oferece branding: a home apresenta as frentes atuais
    location = /ativacoes  { return 301 /ativacoes-promocionais/; }
    location = /degustacao { return 301 /ativacoes-promocionais/; }
    location = /hotelaria  { return 301 /hotelaria-e-gastronomia/; }
    location = /gastronomia { return 301 /hotelaria-e-gastronomia/; }
    location ^~ /projetos  { return 301 /sobre/; }                       # projetos e cases saíram do site
    location = /contato    { return 301 /solicitar-proposta/; }
    location = /proposta   { return 301 /solicitar-proposta/; }

    # formulário de proposta -> webhook do n8n (rede interna do Easypanel; resolvido em tempo de execução)
    resolver 127.0.0.11 valid=30s ipv6=off;
    location = /api/proposta {
        limit_except POST { deny all; }
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        set $n8n_upstream http://tama_n8n:5678;
        proxy_pass $n8n_upstream/webhook/proposta;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # arquivos com hash no nome: cache de 1 ano
    location ~ ^/(img|fonts|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # fotos originais do catálogo (usadas pelo editor /admin/): fora da busca
    location ^~ /img/produtos/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # editor do site: CSP própria (ver admin-headers.conf)
    location ^~ /admin/ {
        include /etc/nginx/snippets/admin-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
