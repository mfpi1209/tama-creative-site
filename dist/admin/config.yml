# Gerado por blog.py a cada build (não editar à mão): opções vindas de TEMAS, do catálogo (produtos.json) e das imagens do site.
backend:
  name: github
  repo: mfpi1209/tama-creative-site
  branch: main
  base_url: https://tamacreative.com.br
  auth_endpoint: api/cms-auth/auth
  squash_merges: true
  commit_messages:
    create: 'Editor ({{collection}}): cria {{slug}}'
    update: 'Editor ({{collection}}): atualiza {{slug}}'
    delete: 'Editor ({{collection}}): remove {{slug}}'
    uploadMedia: 'Editor: envia imagem {{path}}'
    deleteMedia: 'Editor: remove imagem {{path}}'
    openAuthoring: 'Editor: {{message}}'
local_backend:
  url: http://localhost:8081/api/v1
publish_mode: editorial_workflow
locale: pt
site_url: https://tamacreative.com.br
display_url: https://tamacreative.com.br
logo_url: /admin/logo.svg
media_folder: img/blog
public_folder: /img/blog
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: blog
  label: Artigos do blog
  label_singular: artigo
  description: Guias do blog. Cada artigo publicado vai para tamacreative.com.br/blog/ depois do build (alguns minutos).
  folder: src/blog
  create: true
  extension: md
  format: frontmatter
  identifier_field: breadcrumb
  slug: '{{slug}}'
  preview_path: blog/{{slug}}/
  summary: '{{title}} · {{date}}'
  sortable_fields:
  - date
  - title
  view_groups:
  - label: Tema
    field: tema
  fields:
  - label: Título do artigo (H1)
    name: title
    widget: string
    hint: Responde à busca principal com naturalidade. Até 110 caracteres.
    pattern:
    - ^.{10,110}$
    - Use de 10 a 110 caracteres
  - label: Título curto
    name: breadcrumb
    widget: string
    hint: 'Aparece no caminho (Início / Blog / …) e forma o endereço do artigo. Ex.: Kit de boas-vindas'
    pattern:
    - ^.{3,60}$
    - Use de 3 a 60 caracteres
  - label: Título no Google (SEO)
    name: seo_title
    widget: string
    hint: O que aparece no resultado de busca. Comece pela palavra-chave e termine com " | TaMa". Ideal até 65 caracteres.
    pattern:
    - ^.{20,70}$
    - Use de 20 a 70 caracteres (ideal até 65)
  - label: Descrição (SEO)
    name: description
    widget: text
    hint: Resumo que aparece no Google, nos cards do blog e abaixo do título. De 70 a 160 caracteres.
    pattern:
    - ^[\s\S]{70,160}$
    - Use de 70 a 160 caracteres
  - label: Resumo do card
    name: resumo
    widget: string
    required: false
    hint: Uma frase curta para o card da listagem e a linha abaixo do título. Até 160 caracteres. Vazio usa a descrição.
    pattern:
    - ^.{0,160}$
    - Use até 160 caracteres
  - label: Palavra-chave principal
    name: palavra_chave
    widget: string
    hint: A busca que o artigo responde, como as pessoas digitam. Use-a no título, na descrição e no primeiro parágrafo.
  - widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    picker_utc: true
    label: Data de publicação
    name: date
    hint: Data futura = o artigo só aparece a partir desse dia (no próximo build).
  - widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    picker_utc: true
    label: Atualizado em
    name: updated
    required: false
    default: ''
    hint: Preencha só quando revisar o conteúdo de verdade (o Google mostra a data de atualização).
  - widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    picker_utc: true
    label: Próxima revisão
    name: revisar_em
    required: false
    default: ''
    hint: Opcional. Quando conferir o artigo de novo (lei, valor ou dado que pode mudar). Aparece no Painel de SEO.
  - label: O que revisar
    name: revisar_motivo
    widget: string
    required: false
    hint: 'Ex.: conferir o valor do limite de brindes (1% do subsídio do STF).'
  - label: Destaque no blog
    name: destaque
    widget: boolean
    default: false
    required: false
    hint: Coloca o artigo em destaque entre os publicados no mesmo dia.
  - label: Categoria
    name: tema
    widget: select
    options:
    - label: Brindes e presentes
      value: brindes-e-presentes
    - label: Kits e boas-vindas
      value: kits-e-boas-vindas
    - label: Confecções e personalização
      value: confeccoes-e-personalizacao
    - label: Embalagem e acabamento
      value: embalagem-e-acabamento
    - label: Eventos e ativações
      value: eventos-e-ativacoes
    - label: Hotelaria e gastronomia
      value: hotelaria-e-gastronomia
    - label: Planejamento de compras
      value: planejamento-de-compras
    hint: Vira filtro na listagem do blog. A página da categoria aparece com 3 artigos publicados.
  - label: Ocasião da curadoria
    name: ocasiao
    widget: select
    required: false
    options:
    - label: Boas-vindas
      value: boas-vindas
    - label: Eventos
      value: eventos
    - label: Presentes executivos
      value: executivos
    - label: Campanhas e ativações
      value: campanhas
    - label: Lançamentos
      value: lancamentos
    - label: Fim de ano
      value: fim-de-ano
    - label: Reconhecimento
      value: reconhecimento
    hint: Liga o artigo à curadoria filtrada (/brindes-por-ocasiao/?ocasiao=…).
  - label: Página de serviço
    name: servico
    widget: select
    required: false
    options:
    - label: Brindes corporativos
      value: /brindes-corporativos/
    - label: Kits corporativos
      value: /kits-corporativos/
    - label: Brindes por ocasião
      value: /brindes-por-ocasiao/
    - label: Brindes de fim de ano
      value: /brindes-de-fim-de-ano/
    - label: O catálogo
      value: /catalogo/
    - label: Ativações promocionais
      value: /ativacoes-promocionais/
    - label: Hotelaria e gastronomia
      value: /hotelaria-e-gastronomia/
    - label: Uniformes e confecções
      value: /confeccoes-personalizadas/
    hint: Botão para o serviço no fim do artigo. Sem serviço nem tipo de proposta, o artigo fica só editorial (sem vitrine nem chamadas comerciais), como o de compliance.
  - label: Tipo de proposta
    name: proposta
    widget: select
    required: false
    options:
    - label: Brindes corporativos
      value: brindes
    - label: Kits premium
      value: kits
    - label: Confecções e uniformes
      value: confeccoes
    - label: Ativação ou degustação
      value: ativacoes
    - label: Hotelaria e gastronomia
      value: hotelaria
    - label: Mais de uma frente
      value: integrado
    hint: Já vem marcado no formulário quando o leitor clica em Solicitar proposta.
