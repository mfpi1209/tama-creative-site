# Site estático TaMa Creative (substitui _headers e _redirects do Netlify).
# HTTPS e domínio ficam no Traefik do Easypanel; aqui é só HTTP interno.
# limite de envios do formulário por IP (protege o webhook do n8n)
limit_req_zone $binary_remote_addr zone=forms:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # URLs antigas (301)
    location = /brindes    { return 301 /brindes/; }   # /brindes/ = app "brindes" (Traefik, path /brindes/)
    location = /kits       { return 301 /kits-corporativos/; }
    location = /curadoria  { return 301 /brindes-corporativos-premium/; }
    location = /confeccoes { return 301 /confeccoes-personalizadas/; }
    location = /uniformes  { return 301 /confeccoes-personalizadas/; }
    location = /marcas     { return 301 /branding-identidade-visual/; }
    location = /branding   { return 301 /branding-identidade-visual/; }
    location = /contato    { return 301 /solicitar-proposta/; }
    location = /proposta   { return 301 /solicitar-proposta/; }

    # formulário de proposta -> webhook do n8n (rede interna do Easypanel; resolvido em tempo de execução)
    resolver 127.0.0.11 valid=30s ipv6=off;
    location = /api/proposta {
        limit_except POST { deny all; }
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        set $n8n_upstream http://tama_n8n:5678;
        proxy_pass $n8n_upstream/webhook/proposta;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # Editor do blog (/admin/, Decap CMS): política de segurança própria (o Decap precisa de 'unsafe-eval' e da API do
    # GitHub) no lugar da do site, fora do Google e sem cache. Os add_header daqui substituem os herdados do server.
    location ^~ /admin/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.githubusercontent.com; connect-src 'self' https://api.github.com https://*.githubusercontent.com; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        types { text/html html; application/javascript js; text/css css; text/yaml yml; image/svg+xml svg; text/plain txt; application/json json; }
        try_files $uri $uri/ =404;
    }

    # Login GitHub do editor -> app "cms-auth" do Easypanel (rede interna). A página de retorno traz a própria CSP.
    location ^~ /api/cms-auth/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=forms burst=10 nodelay;
        limit_req_status 429;
        set $cms_auth_upstream http://tama_cms-auth:8080;
        rewrite ^/api/cms-auth/(.*)$ /$1 break;
        proxy_pass $cms_auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # arquivos com hash no nome: cache de 1 ano
    location ~ ^/(img|fonts|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
