# O site oficial é servido pelo Easypanel (ver docs/DEPLOY.md). O Netlify só redireciona a cópia antiga
# (tamacreative.netlify.app) para https://tamacreative.com.br, com 301 em todas as URLs, e não publica formulários.
# Se o Netlify ainda estiver ligado ao repositório, o próximo build já publica só o redirecionamento.
# Sem ligação com o Git, publicar uma vez:  netlify deploy --prod --dir netlify/redirecionar
# O login do editor /admin/ (OAuth do Netlify para o GitHub) não depende do conteúdo publicado aqui.
[build]
  command = "echo 'Somente redirecionamento para tamacreative.com.br'"
  publish = "netlify/redirecionar"
