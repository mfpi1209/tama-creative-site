# Site estático TaMa Creative (substitui _headers e _redirects do Netlify).
# HTTPS e domínio ficam no Traefik do Easypanel; aqui é só HTTP interno.
# limite de envios do formulário por IP (protege o webhook do n8n)
limit_req_zone $binary_remote_addr zone=forms:1m rate=6r/m;
# inventário (/api/admin/): login com poucas tentativas por minuto; leitura e gravação com folga para as fotos
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=admin_api:1m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # IP real do visitante (o Traefik do Easypanel fica na frente): sem isto, o limite de envios do formulário
    # valeria para todos os visitantes juntos, porque todos chegariam com o IP do Traefik.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # arquivos de configuração do Netlify gerados pelo build: não servir
    location ~ ^/_(redirects|headers)$ { return 404; }

    # URLs antigas (301), com ou sem barra no final; os prefixos só pegam o próprio caminho e o que vem depois de "/"
    location ~ ^/brindes/?$                            { return 301 /brindes-corporativos/; }   # mesmo destino do #brindes da home (src/site.js)
    location ~ ^/brindes/.+$                           { return 301 /catalogo/; }   # páginas do antigo app de catálogo
    location ~ ^/adm/?$                                { return 301 /admin/; }
    location ~ ^/kits/?$                               { return 301 /kits-corporativos/; }
    location ~ ^/curadoria/?$                          { return 301 /brindes-por-ocasiao/; }
    location ^~ /brindes-corporativos-premium          { return 301 /brindes-por-ocasiao/$is_args$args; }   # endereço antigo da página de ocasiões
    location ~ ^/(confeccoes|uniformes)/?$             { return 301 /confeccoes-personalizadas/; }
    location ~ ^/marcas/?$                             { return 301 /catalogo/; }   # mesmo destino do #marcas da home (src/site.js)
    location ~ ^/branding/?$                           { return 301 /; }
    location ~ ^/branding-identidade-visual(/.*)?$     { return 301 /; }   # a TaMa não oferece branding: a home apresenta as frentes atuais
    location ~ ^/projetos(/.*)?$                       { return 301 /sobre/; }   # projetos e cases saíram do site
    location ~ ^/(contato|proposta)/?$                 { return 301 /solicitar-proposta/; }
    location ~ ^/(ativacoes|degustacao)/?$             { return 301 /eventos-corporativos/; }
    location ~ ^/ativacoes-promocionais(-eventos-corporativos)?/?$  { return 301 /eventos-corporativos/$is_args$args; }   # endereços antigos da página (até 24/10/2026)
    location ~ ^/(hotelaria|gastronomia)/?$            { return 301 /hotelaria-e-gastronomia/; }
    # endereço curto para divulgar (Instagram, WhatsApp, e-mail): mantém ?utm_... da campanha
    location ~ ^/(fim-de-ano|natal)/?$                 { return 301 /brindes-de-fim-de-ano/$is_args$args; }

    # formulário de proposta -> webhook do n8n (rede interna do Easypanel; resolvido em tempo de execução)
    resolver 127.0.0.11 valid=30s ipv6=off;
    location = /api/proposta {
        limit_except POST { deny all; }
        limit_req zone=forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        set $n8n_upstream http://tama_n8n:5678;
        proxy_pass $n8n_upstream/webhook/proposta;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # arquivos com hash no nome: cache de 1 ano
    location ~ ^/(img|fonts|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # fotos originais do catálogo (usadas pelo editor /admin/): fora da busca
    location ^~ /img/produtos/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Login GitHub do editor -> app "cms-auth" do Easypanel (rede interna; porta 80, como está no ar).
    # A página de retorno traz a própria CSP.
    location ^~ /api/cms-auth/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=forms burst=10 nodelay;
        limit_req_status 429;
        set $cms_auth_upstream http://tama_cms-auth:80;
        rewrite ^/api/cms-auth/(.*)$ /$1 break;
        proxy_pass $cms_auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # Inventário com usuário e senha -> app "admin-api" do Easypanel (rede interna, porta 8080; deploy/admin-api/).
    # Sem o app, responde 502 e a tela avisa que o acesso ainda não está ligado.
    location = /api/admin/login {
        limit_except POST { deny all; }
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $admin_api_upstream http://tama_admin-api:8080;
        proxy_pass $admin_api_upstream/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
    location ^~ /api/admin/ {
        limit_req zone=admin_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 60m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $admin_api_upstream http://tama_admin-api:8080;
        rewrite ^/api/admin/(.*)$ /$1 break;
        proxy_pass $admin_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # endereço curto do inventário
    location ~ ^/inventario/?$ { return 301 /admin/inventario/; }

    # editor do site: CSP própria (ver admin-headers.conf)
    location ^~ /admin/ {
        include /etc/nginx/snippets/admin-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        # HTML e demais arquivos sem hash: o navegador sempre confere a versão (as imagens antigas deixam de existir a cada build)
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
