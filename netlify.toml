# O site oficial é servido pelo Easypanel (ver docs/DEPLOY.md). No Netlify:
# - produção (tamacreative.netlify.app): só redireciona tudo para https://tamacreative.com.br (301), sem formulário;
# - prévias de pull request (Deploy Previews, usadas pelo editor /admin/ em "Ver prévia"): geram o site completo
#   para revisão. O Netlify marca as prévias com noindex. O formulário das prévias envia para /api/proposta, que não
#   existe no Netlify: a prévia mostra o estado de erro e nenhum pedido fica parado em outro lugar.
# Sem ligação com o Git, publicar o redirecionamento uma vez:  netlify deploy --prod --dir netlify/redirecionar
[build]
  command = "echo 'Somente redirecionamento para tamacreative.com.br'"
  publish = "netlify/redirecionar"

[context.deploy-preview]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[context.deploy-preview.environment]
  PYTHON_VERSION = "3.13"
