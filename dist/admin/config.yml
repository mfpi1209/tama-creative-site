    name: body
    widget: markdown
    modes:
    - rich_text
    - raw
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    - cta
    hint: 'Use "Título 2" para as seções (entram no sumário) e "Título 3" para subseções. Fato externo sempre com fonte: no modo Markdown, escreva texto[^id] e, no fim, [^id]: Fonte. [Link](https://…). Use o bloco "Chamada para proposta" uma vez no meio do texto.'
- name: pautas
  label: Pautas
  label_singular: pauta
  description: 'Planejamento editorial: uma pauta por consulta de busca. Não aparece no site; o Painel de SEO (/admin/painel/) organiza o calendário e aponta conflitos.'
  folder: src/pautas
  create: true
  extension: md
  format: frontmatter
  identifier_field: titulo
  slug: '{{slug}}'
  summary: '{{titulo}} · {{status}}'
  sortable_fields:
  - titulo
  - prazo
  - status
  view_groups:
  - label: Status
    field: status
  fields:
  - label: Título provisório
    name: titulo
    widget: string
  - label: Consulta-alvo (palavra-chave)
    name: palavra_chave
    widget: string
    hint: Uma consulta por artigo, como as pessoas digitam. O painel avisa se outra página ou pauta já disputa a mesma busca.
  - label: Consultas secundárias
    name: secundarias
    widget: list
    required: false
    hint: Variações que o mesmo artigo pode responder. Uma por linha.
  - label: Status
    name: status
    widget: select
    default: ideia
    options:
    - label: Ideia
      value: ideia
